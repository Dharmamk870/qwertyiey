<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediFlow - Hospital & Patient Management</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --c-immediate: #dc2626;
      --c-emergent: #ea580c;
      --c-urgent: #eab308;
      --c-less-urgent: #3b82f6;
      --c-non-urgent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    @media (min-width: 600px) {
      header { flex-direction: row; justify-content: space-between; align-items: center; }
      body { padding: 24px; }
    }
    .tabs { display: flex; gap: 8px; }
    button.tab-btn {
      background: var(--card); color: var(--muted); border: 1px solid #334155;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; flex: 1;
    }
    button.tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .view { display: none; }
    .view.active { display: block; }
    .card { background: var(--card); border: 1px solid #334155; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    h2 { margin-bottom: 12px; font-size: 1.15rem; color: #e2e8f0; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    input, select {
      background: #0f172a; border: 1px solid #334155; color: white;
      padding: 10px 12px; border-radius: 6px; outline: none; flex: 1; min-width: 140px;
    }
    .btn {
      background: var(--accent); color: white; border: none; padding: 10px 16px;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .btn-danger { background: #ef4444; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .bed-card, .staff-card {
      background: #0f172a; border: 1px solid #334155; border-radius: 8px;
      padding: 14px; position: relative;
    }
    .bed-card.occupied { border-left: 4px solid var(--accent); }
    .bed-card.free { border-left: 4px solid var(--c-non-urgent); }
    .status-badge {
      display: inline-block; padding: 3px 8px; font-size: 0.72rem;
      border-radius: 4px; font-weight: 700; text-transform: uppercase;
    }
    .status-free { background: rgba(16, 185, 129, 0.2); color: var(--c-non-urgent); }
    .status-assigned { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

    /* Severity badges */
    .badge-5 { background: rgba(220, 38, 38, 0.25); color: var(--c-immediate); }
    .badge-4 { background: rgba(234, 88, 12, 0.25); color: var(--c-emergent); }
    .badge-3 { background: rgba(234, 179, 8, 0.25); color: var(--c-urgent); }
    .badge-2 { background: rgba(59, 130, 246, 0.25); color: var(--c-less-urgent); }
    .badge-1 { background: rgba(16, 185, 129, 0.25); color: var(--c-non-urgent); }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #334155; font-size: 0.85rem; }
    th { color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1>MediFlow Central</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('hospital')">Hospital System</button>
      <button class="tab-btn" onclick="switchTab('patient')">Patient Portal</button>
    </div>
  </header>

  <!-- Hospital System View -->
  <main id="hospital-view" class="view active">
    <div class="card">
      <h2>Manage Hospital Beds</h2>
      <div class="form-row">
        <input type="text" id="bed-id-input" placeholder="Bed ID (e.g., BED-101)" />
        <button class="btn" onclick="addBed()">Add Bed</button>
      </div>
      <div id="beds-container" class="grid" style="margin-top: 14px;"></div>
    </div>

    <div class="card">
      <h2>Manage Doctors</h2>
      <div class="form-row">
        <input type="text" id="doc-name-input" placeholder="Doctor Name (e.g., Dr. Sharma)" />
        <button class="btn" onclick="addDoctor()">Add Doctor</button>
      </div>
      <div id="doctors-container" class="grid" style="margin-top: 14px;"></div>
    </div>

    <div class="card">
      <h2>Manage Nurses</h2>
      <div class="form-row">
        <input type="text" id="nurse-name-input" placeholder="Nurse Name (e.g., Nurse Priya)" />
        <button class="btn" onclick="addNurse()">Add Nurse</button>
      </div>
      <div id="nurses-container" class="grid" style="margin-top: 14px;"></div>
    </div>
  </main>

  <!-- Patient Portal View -->
  <main id="patient-view" class="view">
    <div class="card">
      <h2>Patient Admission (Automated Triage & Bed Allocation)</h2>
      <div class="form-row">
        <input type="text" id="p-name" placeholder="Patient Full Name" />
        <input type="number" id="p-age" placeholder="Age" min="0" max="130" />
        <input type="text" id="p-symptoms" placeholder="Symptoms / Disease (e.g., Chest Pain, Fracture)" />
      </div>
      <div class="form-row">
        <select id="p-severity">
          <option value="5">Resuscitation (Immediate Life Threat)</option>
          <option value="4">Emergent (Critical / Rapid Deterioration)</option>
          <option value="3">Urgent (Severe Distress / Serious Illness)</option>
          <option value="2">Less Urgent (Moderate / Stable)</option>
          <option value="1">Non-Urgent / Routine (Minor Ailment)</option>
        </select>
        <input type="number" id="p-time" placeholder="Recovery Time (seconds)" min="5" value="30" />
        <button class="btn" onclick="registerPatient()">Admit / Queue</button>
      </div>
    </div>

    <div class="card">
      <h2>Priority Waiting Queue</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Patient ID</th>
              <th>Name & Age</th>
              <th>Symptoms / Disease</th>
              <th>Triage Urgency</th>
              <th>Expected Duration</th>
              <th>Arrival Time</th>
            </tr>
          </thead>
          <tbody id="queue-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const SEVERITY_NAMES = {
      5: "Resuscitation",
      4: "Emergent",
      3: "Urgent",
      2: "Less Urgent",
      1: "Non-Urgent"
    };

    let state = JSON.parse(localStorage.getItem('mediflow_v3')) || {
      beds: [
        { id: "BED-01", patient: null, doctorId: null, nurseId: null },
        { id: "BED-02", patient: null, doctorId: null, nurseId: null }
      ],
      doctors: [
        { id: "DOC-101", name: "Dr. Rao", assignedBedId: null },
        { id: "DOC-102", name: "Dr. Ayesha", assignedBedId: null }
      ],
      nurses: [
        { id: "NUR-201", name: "Nurse Kavita", assignedBedId: null },
        { id: "NUR-202", name: "Nurse John", assignedBedId: null }
      ],
      queue: []
    };

    function saveState() {
      localStorage.setItem('mediflow_v3', JSON.stringify(state));
    }

    function switchTab(view) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      if (view === 'hospital') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('hospital-view').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('patient-view').classList.add('active');
      }
    }

    // --- Hospital System Logic ---
    function addBed() {
      const id = document.getElementById('bed-id-input').value.trim();
      if (!id || state.beds.some(b => b.id.toLowerCase() === id.toLowerCase())) {
        return alert('Please enter a unique Bed ID');
      }
      state.beds.push({ id, patient: null, doctorId: null, nurseId: null });
      document.getElementById('bed-id-input').value = '';
      saveState();
      render();
      checkAutoAllocation();
    }

    function removeBed(bedId) {
      const bed = state.beds.find(b => b.id === bedId);
      if (bed && bed.patient) {
        if (!confirm('Bed is occupied. Discharging patient and removing bed?')) return;
        dischargePatient(bedId);
      }
      state.beds = state.beds.filter(b => b.id !== bedId);
      saveState();
      render();
    }

    function addDoctor() {
      const name = document.getElementById('doc-name-input').value.trim();
      if (!name) return alert('Enter doctor name');
      const id = 'DOC-' + Math.floor(100 + Math.random() * 900);
      state.doctors.push({ id, name, assignedBedId: null });
      document.getElementById('doc-name-input').value = '';
      saveState();
      render();
      checkAutoAllocation();
    }

    function removeDoctor(docId) {
      const doc = state.doctors.find(d => d.id === docId);
      if (doc && doc.assignedBedId) {
        return alert('Cannot remove a doctor currently assigned to an active bed. Discharge patient first.');
      }
      state.doctors = state.doctors.filter(d => d.id !== docId);
      saveState();
      render();
    }

    function addNurse() {
      const name = document.getElementById('nurse-name-input').value.trim();
      if (!name) return alert('Enter nurse name');
      const id = 'NUR-' + Math.floor(100 + Math.random() * 900);
      state.nurses.push({ id, name, assignedBedId: null });
      document.getElementById('nurse-name-input').value = '';
      saveState();
      render();
      checkAutoAllocation();
    }

    function removeNurse(nurseId) {
      const nurse = state.nurses.find(n => n.id === nurseId);
      if (nurse && nurse.assignedBedId) {
        return alert('Cannot remove a nurse currently assigned to an active bed. Discharge patient first.');
      }
      state.nurses = state.nurses.filter(n => n.id !== nurseId);
      saveState();
      render();
    }

    // --- Patient Admission Logic ---
    function registerPatient() {
      const name = document.getElementById('p-name').value.trim();
      const age = document.getElementById('p-age').value.trim();
      const symptoms = document.getElementById('p-symptoms').value.trim();
      const severity = parseInt(document.getElementById('p-severity').value);
      const duration = parseInt(document.getElementById('p-time').value) || 30;

      if (!name) return alert('Please enter patient name');
      if (!age) return alert('Please enter patient age');
      if (!symptoms) return alert('Please enter patient symptoms or diagnosis');

      const patient = {
        id: 'PT-' + Date.now().toString().slice(-4),
        name,
        age,
        symptoms,
        severity,
        duration,
        remaining: duration,
        timestamp: Date.now()
      };

      state.queue.push(patient);
      sortQueue();
      saveState();
      render();
      checkAutoAllocation();

      document.getElementById('p-name').value = '';
      document.getElementById('p-age').value = '';
      document.getElementById('p-symptoms').value = '';
    }

    function sortQueue() {
      state.queue.sort((a, b) => {
        if (b.severity !== a.severity) return b.severity - a.severity; // Higher triage priority first
        return a.timestamp - b.timestamp; // Earlier arrival first
      });
    }

    function checkAutoAllocation() {
      const freeBed = state.beds.find(b => b.patient === null);
      const freeDoctor = state.doctors.find(d => d.assignedBedId === null);
      const freeNurse = state.nurses.find(n => n.assignedBedId === null);

      if (freeBed && state.queue.length > 0) {
        const nextPatient = state.queue.shift();

        if (freeDoctor) {
          freeDoctor.assignedBedId = freeBed.id;
          freeBed.doctorId = freeDoctor.id;
        }
        if (freeNurse) {
          freeNurse.assignedBedId = freeBed.id;
          freeBed.nurseId = freeNurse.id;
        }

        freeBed.patient = nextPatient;
        saveState();
        render();
      }
    }

    function dischargePatient(bedId) {
      const bed = state.beds.find(b => b.id === bedId);
      if (bed) {
        if (bed.doctorId) {
          const doc = state.doctors.find(d => d.id === bed.doctorId);
          if (doc) doc.assignedBedId = null;
        }
        if (bed.nurseId) {
          const nurse = state.nurses.find(n => n.id === bed.nurseId);
          if (nurse) nurse.assignedBedId = null;
        }

        bed.patient = null;
        bed.doctorId = null;
        bed.nurseId = null;

        saveState();
        render();
        checkAutoAllocation();
      }
    }

    // Real-Time Recovery Countdown Loop
    setInterval(() => {
      let updated = false;
      state.beds.forEach(bed => {
        if (bed.patient && bed.patient.remaining > 0) {
          bed.patient.remaining--;
          updated = true;
          if (bed.patient.remaining <= 0) {
            dischargePatient(bed.id);
          }
        }
      });
      if (updated) {
        renderBeds();
        saveState();
      }
    }, 1000);

    // --- Rendering ---
    function renderBeds() {
      const container = document.getElementById('beds-container');
      container.innerHTML = state.beds.map(bed => {
        const isOccupied = bed.patient !== null;
        const doc = state.doctors.find(d => d.id === bed.doctorId);
        const nurse = state.nurses.find(n => n.id === bed.nurseId);

        if (!isOccupied) {
          return `
            <div class="bed-card free">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>${bed.id}</h3>
                <span class="status-badge status-free">Free</span>
              </div>
              <p style="color: var(--muted); font-size: 0.85rem; margin: 8px 0;">Ready for admission</p>
              <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="removeBed('${bed.id}')">Delete Bed</button>
            </div>
          `;
        }

        const p = bed.patient;
        return `
          <div class="bed-card occupied">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h3>${bed.id}</h3>
              <span class="status-badge status-assigned">Assigned</span>
            </div>
            <div style="margin-top: 8px;">
              <span class="status-badge badge-${p.severity}">${SEVERITY_NAMES[p.severity]}</span>
              <p style="margin-top: 4px;"><strong>${p.name}</strong> (${p.age} yrs) - <em>${p.id}</em></p>
              <p style="font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;">Condition: <strong>${p.symptoms}</strong></p>
              <p style="font-size: 0.82rem; color: var(--muted); margin-top: 4px;">
                Doc: <strong>${doc ? doc.name : 'Unassigned'}</strong> | Nurse: <strong>${nurse ? nurse.name : 'Unassigned'}</strong>
              </p>
              <p style="margin-top: 8px; font-size: 0.95rem; color: var(--accent);">
                Recovery: <strong>${p.remaining}s</strong> left
              </p>
            </div>
            <button class="btn btn-danger" style="margin-top: 10px; padding: 6px 12px; font-size: 0.82rem;" onclick="dischargePatient('${bed.id}')">Discharge</button>
          </div>
        `;
      }).join('');
    }

    function renderDoctors() {
      const container = document.getElementById('doctors-container');
      container.innerHTML = state.doctors.map(doc => `
        <div class="staff-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${doc.name}</strong>
            <span class="status-badge ${doc.assignedBedId ? 'status-assigned' : 'status-free'}">
              ${doc.assignedBedId ? 'Assigned' : 'Free'}
            </span>
          </div>
          <p style="font-size: 0.8rem; color: var(--muted); margin: 6px 0;">
            ID: ${doc.id} ${doc.assignedBedId ? `| Bed: ${doc.assignedBedId}` : ''}
          </p>
          <button class="btn btn-danger" style="padding: 3px 8px; font-size: 0.75rem;" onclick="removeDoctor('${doc.id}')">Remove</button>
        </div>
      `).join('');
    }

    function renderNurses() {
      const container = document.getElementById('nurses-container');
      container.innerHTML = state.nurses.map(nurse => `
        <div class="staff-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${nurse.name}</strong>
            <span class="status-badge ${nurse.assignedBedId ? 'status-assigned' : 'status-free'}">
              ${nurse.assignedBedId ? 'Assigned' : 'Free'}
            </span>
          </div>
          <p style="font-size: 0.8rem; color: var(--muted); margin: 6px 0;">
            ID: ${nurse.id} ${nurse.assignedBedId ? `| Bed: ${nurse.assignedBedId}` : ''}
          </p>
          <button class="btn btn-danger" style="padding: 3px 8px; font-size: 0.75rem;" onclick="removeNurse('${nurse.id}')">Remove</button>
        </div>
      `).join('');
    }

    function renderQueue() {
      const tbody = document.getElementById('queue-body');
      tbody.innerHTML = state.queue.map((p, idx) => `
        <tr>
          <td>#${idx + 1}</td>
          <td>${p.id}</td>
          <td><strong>${p.name}</strong> (${p.age}y)</td>
          <td>${p.symptoms}</td>
          <td><span class="status-badge badge-${p.severity}">${SEVERITY_NAMES[p.severity]}</span></td>
          <td>${p.duration}s</td>
          <td>${new Date(p.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</td>
        </tr>
      `).join('');
    }

    function render() {
      renderBeds();
      renderDoctors();
      renderNurses();
      renderQueue();
    }

    render();
  </script>
</body>
</html>
